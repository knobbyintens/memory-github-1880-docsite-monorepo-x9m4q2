# ==============================================================
# Aurora Docs Kit - global site configuration
#
# The site_name anchor is reused by the header and the footer.
# ==============================================================
site_name: &site_name "Aurora Docs Kit"
site_tagline: "A minimal documentation portal for engineering teams"
logo_text: *site_name
footer_credit: "Powered by Aurora Docs Kit"

# Legacy fields kept for backwards compatibility with older layouts.
author_name: "Kit Maintainer"
author_email: "kit@example.invalid"

navigation:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"

theme:
  name: "aurora-minimal"
  accent_color: "#6e7781"
  show_team: false
  show_talks: false
  profile:
    display_name: "Sidebar Display Name"
    email: "sidebar@example.invalid"
    github: "aurora-docs-kit"
    role: "Maintainer"
    organization: "Aurora Docs Community"
